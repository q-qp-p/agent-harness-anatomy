<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="960" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">Attention - a worker question reaches a person</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">the question parks the Ticket at the person stage; the answer returns as an Input, retried from 2s doubling to 1 min</text>
