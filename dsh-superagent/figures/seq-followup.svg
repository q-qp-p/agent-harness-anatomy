<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 862" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="862" fill="#f7f2e9"/>
<text x="90.78014184397163" y="44" font-size="26" font-weight="700" fill="#000000">Follow-ups - the owning worker decides</text>
<text x="90.78014184397163" y="74" font-size="15" fill="#000000">a person&#x27;s follow-up on a followed Thread bypasses Eval; closing the Thread ends the Ticket once its follows are done</text>
<line x1="233" y1="110" x2="233" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="113" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="233" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Person</text>
<line x1="516" y1="110" x2="516" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="397" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="516" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">GitHub Source</text>
<line x1="800" y1="110" x2="800" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="681" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Engine</text>
<line x1="1084" y1="110" x2="1084" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="965" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1084" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Ticket</text>
<line x1="1367" y1="110" x2="1367" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1248" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1367" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Worker (dsh)</text>
<line x1="233" y1="191" x2="506" y2="191" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="177" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="314" y="182" font-size="14" fill="#000000">follow-up comment on the PR thread</text>
<line x1="516" y1="252" x2="790" y2="252" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="238" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="598" y="243" font-size="14" fill="#000000">receive(Trigger) on followed Thread</text>
<path d="M 800 313 h 50 v 30 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="825" cy="297" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="825" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="860" y="318" font-size="14" fill="#000000">fan out to subscribed Tickets</text>
<line x1="800" y1="374" x2="1074" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="360" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="882" y="365" font-size="14" fill="#000000">deliver follow-up to owning Ticket</text>
<rect x="681" y="409" width="806" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="1084" y="436" text-anchor="middle" font-size="14" fill="#000000">a person&#x27;s follow-up bypasses Eval - the owning worker decides it</text>
<line x1="800" y1="508" x2="1357" y2="508" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1006" cy="494" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1006" y="499" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="1024" y="499" font-size="14" fill="#000000">attach: resume with follow-up input</text>
<line x1="233" y1="570" x2="506" y2="570" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="556" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="561" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="314" y="561" font-size="14" fill="#000000">closes the PR (merged / closed)</text>
<line x1="516" y1="631" x2="790" y2="631" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="617" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="598" y="622" font-size="14" fill="#000000">receive(Trigger): thread closed</text>
<line x1="800" y1="692" x2="1074" y2="692" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="678" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="683" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="882" y="683" font-size="14" fill="#000000">followsDone: every follow complete</text>
<path d="M 1084 753 h 50 v 30 H 1094" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1109" cy="737" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1109" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="1144" y="758" font-size="14" fill="#000000">Ticket ends (merged / closed)</text>
</svg>