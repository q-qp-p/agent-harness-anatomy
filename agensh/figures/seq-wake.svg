<rect x="397" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="516" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Mattermost</text>
<line x1="800" y1="110" x2="800" y2="733" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="681" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Mini-router</text>
<line x1="1084" y1="110" x2="1084" y2="733" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="965" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1084" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Board</text>
<line x1="1367" y1="110" x2="1367" y2="733" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1248" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1367" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Copilot</text>
<line x1="233" y1="191" x2="506" y2="191" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="177" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="314" y="182" font-size="14" fill="#000000">kickoff DM (staggered 30s, then 3s)</text>
<line x1="516" y1="252" x2="790" y2="252" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="580" cy="238" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="580" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="598" y="243" font-size="14" fill="#000000">websocket event: new DM post</text>
<path d="M 800 313 h 50 v 30 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="825" cy="297" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="825" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="860" y="318" font-size="14" fill="#000000">dedup (dedup_key, agent); enqueue pending</text>
<line x1="800" y1="374" x2="1074" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="360" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="882" y="365" font-size="14" fill="#000000">GET /snapshot (unread gists)</text>
<line x1="1084" y1="436" x2="810" y2="436" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="864" cy="422" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="864" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="882" y="427" font-size="14" fill="#000000">rendered SHARED CONTEXT block</text>
<line x1="800" y1="497" x2="1357" y2="497" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1006" cy="483" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1006" y="488" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="1024" y="488" font-size="14" fill="#000000">ACP prompt: prefix + [event] batch (&lt;=32)</text>
<line x1="1367" y1="558" x2="810" y2="558" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="1006" cy="544" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="1006" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="1024" y="549" font-size="14" fill="#000000">turn complete (stopReason)</text>
<path d="M 800 620 h 50 v 30 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="825" cy="604" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="825" y="609" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="860" y="625" font-size="14" fill="#000000">mark batch sent only after the turn</text>
<rect x="113" y="654" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="681" text-anchor="middle" font-size="14" fill="#000000">Dispatch is serialized: one ACP prompt at a time per worker; failures retry with backoff</text>
</svg>