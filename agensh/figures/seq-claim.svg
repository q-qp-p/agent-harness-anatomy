<text x="1006" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="1024" y="549" font-size="14" fill="#000000">gist visible at turn start + mid-turn</text>
<rect x="113" y="592" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="619" text-anchor="middle" font-size="14" fill="#000000">Then back to step 1: the cycle repeats until the wall-clock budget ends</text>
