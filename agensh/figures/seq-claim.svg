<circle cx="296" cy="238" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="296" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="314" y="243" font-size="14" fill="#000000">observed behavior</text>
